services:
  mongodb:
    image: mongo:6.0
    container_name: disha_machinary_mongodb
    restart: always
    ports:
      - "${MONGODB_PORT:-27021}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - crm-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disha_machinary_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-5010}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE=${DATABASE:-mongodb://mongodb:27017/disha-machinary}
      - JWT_SECRET=${JWT_SECRET:-disha_machinary_production_secret_jwt_key_2026}
      - OPENSSL_CONF=/dev/null
    depends_on:
      - mongodb
    volumes:
      - backend-uploads:/app/src/public/uploads
      - backend-downloads:/app/src/public/download
    networks:
      - crm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disha_machinary_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-97}:80"
    depends_on:
      - backend
    networks:
      - crm-network

volumes:
  mongo-data:
    driver: local
  backend-uploads:
    driver: local
  backend-downloads:
    driver: local

networks:
  crm-network:
    driver: bridge
